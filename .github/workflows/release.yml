name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test
        run: swift test
      - name: Import signing certificate
        env:
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KCPASS="$(openssl rand -hex 16)"
          echo "$SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$RUNNER_TEMP/signing.p12" -k "$KC" -P "$SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KCPASS" "$KC" > /dev/null
          rm "$RUNNER_TEMP/signing.p12"
          echo "SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"
      - name: Build and sign
        env:
          SIGN_IDENTITY: ContactMirror Code Signing
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/build-app.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          [ -z "$NOTES" ] && NOTES="ContactMirror $GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/ContactMirror.zip --title "ContactMirror ${GITHUB_REF_NAME#v}" --notes "$NOTES"
